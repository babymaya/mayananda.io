<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <title>Mayananda — Armillary Rings</title>
    <meta name="description" content="An interactive WebGL piece: concentric polygon rings nested on a gimbal, with video mapped onto the mesh and the rotation driven by scroll." />
    <link rel="canonical" href="https://mayananda.com/" />

    <!-- Favicon is an inline SVG data URI: three nested rings, echoing the piece.
         Single quotes inside the SVG so the attribute stays valid; # and < > are
         percent-encoded. No file, no request. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Cg fill='none' stroke='%23c10f0f' stroke-width='2'%3E%3Ccircle cx='16' cy='16' r='13'/%3E%3Ccircle cx='16' cy='16' r='8.5'/%3E%3Ccircle cx='16' cy='16' r='4'/%3E%3C/g%3E%3C/svg%3E" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mayananda.com/" />
    <meta property="og:title" content="Mayananda — Armillary Rings" />
    <meta property="og:description" content="An interactive WebGL piece: concentric polygon rings nested on a gimbal, with video mapped onto the mesh and the rotation driven by scroll." />
    <meta property="og:image" content="https://mayananda.com/logoA.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" href="/rings.glb" as="fetch" crossorigin />
    <link rel="stylesheet" href="/style.css">

</head>


<body>
    <!-- The page is almost entirely a WebGL canvas, which carries no text for a
         screen reader or a crawler. This block supplies it. Hidden with the clip
         technique rather than display:none, which would hide it from assistive
         tech too. Inline because style.css is not edited here. -->
    <div style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0">
        <h1>Mayananda — Armillary Rings</h1>
        <p>An interactive WebGL piece. Concentric polygon rings are nested on a
           gimbal and rotate as you scroll. A tray at the bottom of the page opens
           the client work, 3D, coding, and about pages.</p>
    </div>

    <div class='container'>
        <img src="logoA.png" id="logo" alt="Mayananda logo"/>
    </div>

    <!-- Scroll runway, in vh so the sequence is the same length in screenfuls
         on desktop and on a phone. -->
    <section class="scrub"></section>

    <!-- Source for the video texture mapped onto the gold boxes. Loaded by
         main.js after the rings are on screen. muted + playsinline are required
         for iOS to play it at all; it is never displayed as a DOM element. -->
    <video id="reel" loop muted playsinline preload="none" crossorigin="anonymous"
           style="display:none">
        <source src="/mayaReelA.mp4" type="video/mp4">
    </video>

    <script type="module" src="/desktop.js"></script>
    <script type="module" src="/main.js"></script>
</body>
</html>
